name: Render and publish

on:
    workflow_dispatch:
    push:
      # only for .qmd file and .yml files
      paths:
        - '**.qmd'
        - '**.yml'
        - '_freeze/**'
      branches:
        - master

# GitHub Pages for this repo is configured as "Deploy from branch: master, folder: /docs"
# so publishing just means: render, then commit the updated docs/ folder back to master.
permissions:
  contents: write

jobs:
  publish-site:
    runs-on: ubuntu-latest
    container:
      image: pfeiferl/training-singlecell-rstudio:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build site
        run: |
          quarto render

      - name: Restore archived versions
        run: |
          mkdir -p docs/archive
          cp -R archived_sites/* docs/archive/ 2>/dev/null || true

      - name: Commit and push rendered site
        if: github.ref == 'refs/heads/master'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs _freeze
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Auto-render site [skip ci]"
          git push origin HEAD:master
